services:
  - type: web
    name: prediqt-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: RUN_TRAINER_SCHEDULER
        value: "0"
      - key: NEWS_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
